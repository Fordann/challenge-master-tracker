services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=mysql://${MYSQL_USER:-loltracker}:${MYSQL_PASSWORD:-password}@mariadb:3306/${MYSQL_DATABASE:-loltracker}
      - RIOT_API_KEY=${RIOT_API_KEY}
      - N8N_WEBHOOK_URL=http://n8n:5678/
      - N8N_WEBHOOK_SECRET=${N8N_WEBHOOK_SECRET}
      - REMOVEBG_API_KEY=${REMOVEBG_API_KEY}
      - CHALLENGE_START=${CHALLENGE_START}
      - CHALLENGE_DEADLINE=${CHALLENGE_DEADLINE}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - CRON_INTERVAL_MINUTES=${CRON_INTERVAL_MINUTES:-5}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    volumes:
      - champion_cache:/app/public/champion-cache
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - lol-network

  migrate:
    build:
      context: .
      target: builder
    command: npx prisma db push --skip-generate
    environment:
      - DATABASE_URL=mysql://${MYSQL_USER:-loltracker}:${MYSQL_PASSWORD:-password}@mariadb:3306/${MYSQL_DATABASE:-loltracker}
    depends_on:
      mariadb:
        condition: service_healthy
    networks:
      - lol-network

  mariadb:
    image: mariadb:11
    command: --skip-ssl --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-loltracker}
      MYSQL_USER: ${MYSQL_USER:-loltracker}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-password}
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - lol-network

  n8n:
    image: n8nio/n8n:latest
    ports:
      - "5678:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_BASIC_AUTH_USER:-admin}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_BASIC_AUTH_PASSWORD:-changeme}
      - WEBHOOK_URL=${WEBHOOK_URL:-http://localhost:5678}
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      mariadb:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - lol-network

networks:
  lol-network:
    driver: bridge

volumes:
  mariadb_data:
  n8n_data:
  champion_cache:
